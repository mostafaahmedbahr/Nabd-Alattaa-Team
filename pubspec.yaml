name: nabd_alattaa_team
description: "نبض العطاء - Internal Employee Hub"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0

  # Dependency Injection
  get_it: ^8.0.3

  # Functional Programming
  dartz: ^0.10.1

  # Value Equality
  equatable: ^2.0.7

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.9
  firebase_messaging: ^15.2.9
  firebase_analytics: ^11.4.9
  firebase_crashlytics: ^4.3.9

  # Navigation
  go_router: ^14.8.1

  # Storage
  shared_preferences: ^2.5.3

  # Date & Formatting
  intl: ^0.20.2

  # UI
  skeletonizer: ^1.4.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16
  awesome_dialog:
  fluttertoast: ^8.2.8
  fl_chart: ^0.70.2
  table_calendar: ^3.2.0

  # Utils
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

